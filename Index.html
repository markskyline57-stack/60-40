<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>🇹🇭 คนละครึ่ง 60/40</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

    html,body{height:100%;overflow:hidden;}

    body{
      display:flex;flex-direction:column;
      font-family:'DM Sans',sans-serif;
      transition:background 0.4s;
      /* safe area for notch/dynamic island */
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body.dark{background:linear-gradient(160deg,#0d0221 0%,#1a0533 40%,#001a1a 100%);}
    body.light{background:linear-gradient(160deg,#fff0fa 0%,#e8f4ff 60%,#f0fff4 100%);}

    /* ── App shell fills full screen ── */
    .app{
      display:flex;flex-direction:column;
      height:100dvh; /* dynamic viewport height – handles iOS toolbar */
      max-width:430px;margin:0 auto;width:100%;
      padding:16px 18px 12px;
    }

    /* ── Header ── */
    .hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:10px;}
    .hdr-title{font-weight:700;font-size:17px;transition:color 0.3s;}
    body.dark .hdr-title{color:#fff;}
    body.light .hdr-title{color:#0d0221;}
    .hdr-icons{display:flex;gap:8px;}
    .icon-btn{width:36px;height:36px;border-radius:11px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:transform 0.15s;user-select:none;}
    body.dark .icon-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
    body.light .icon-btn{background:rgba(120,100,255,0.09);border:1px solid rgba(150,130,255,0.22);}
    .icon-btn:active{transform:scale(0.86);}

    /* ── Display ── */
    .disp-area{flex-shrink:0;text-align:right;padding:6px 2px 10px;cursor:pointer;position:relative;}
    .prev-disp{font-family:'DM Mono',monospace;font-size:14px;min-height:20px;transition:color 0.3s;opacity:0.5;}
    body.dark .prev-disp{color:#fff;}
    body.light .prev-disp{color:#0d0221;}
    .main-disp{font-family:'DM Mono',monospace;font-weight:500;letter-spacing:-2px;line-height:1;transition:color 0.3s;}
    body.dark .main-disp{color:#00ffcc;text-shadow:0 0 28px rgba(0,255,200,0.35);}
    body.light .main-disp{color:#0d0221;}
    .copy-hint{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:600;opacity:0;transition:opacity 0.2s;}
    body.dark .copy-hint{color:rgba(0,255,180,0.5);}
    body.light .copy-hint{color:rgba(100,60,200,0.45);}
    .disp-area:hover .copy-hint{opacity:1;}

    /* ── Split tabs ── */
    .split-tabs{display:flex;gap:6px;flex-shrink:0;margin-bottom:10px;}
    .split-tab{flex:1;padding:8px 2px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;font-family:'DM Sans',sans-serif;border:none;}
    body.dark .split-tab{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.4);}
    body.light .split-tab{background:rgba(255,255,255,0.5);border:1px solid rgba(150,130,255,0.2);color:rgba(60,40,160,0.5);}
    .split-tab.active{background:linear-gradient(135deg,#00ffcc,#00b8ff)!important;border-color:transparent!important;color:#0d0221!important;box-shadow:0 4px 14px rgba(0,255,200,0.32);}
    .split-tab:active{transform:scale(0.93);}

    /* ── Share cards ── */
    .shares-row{display:flex;gap:10px;flex-shrink:0;margin-bottom:10px;}
    .share-card{flex:1;border-radius:18px;padding:14px 16px;cursor:pointer;transition:opacity 0.15s;}
    .share-card:active{opacity:0.72;}
    body.dark .share-card.gov{background:linear-gradient(135deg,rgba(0,180,255,0.2),rgba(0,100,255,0.1));border:1px solid rgba(0,180,255,0.3);}
    body.light .share-card.gov{background:linear-gradient(135deg,rgba(0,160,255,0.12),rgba(0,80,255,0.06));border:1px solid rgba(0,140,255,0.2);}
    body.dark .share-card.you{background:linear-gradient(135deg,rgba(255,0,180,0.2),rgba(255,60,120,0.1));border:1px solid rgba(255,0,180,0.3);}
    body.light .share-card.you{background:linear-gradient(135deg,rgba(255,0,150,0.12),rgba(255,60,120,0.06));border:1px solid rgba(255,0,150,0.2);}
    .share-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
    body.dark .share-card.gov .share-lbl{color:#00c8ff;}
    body.light .share-card.gov .share-lbl{color:#0070cc;}
    body.dark .share-card.you .share-lbl{color:#ff40b0;}
    body.light .share-card.you .share-lbl{color:#cc0080;}
    .share-amt{font-family:'DM Mono',monospace;font-weight:500;letter-spacing:-0.5px;line-height:1.1;transition:color 0.3s;font-size:clamp(18px,5vw,26px);}
    body.dark .share-amt{color:#fff;}
    body.light .share-amt{color:#0d0221;}
    .share-sub{font-size:10px;margin-top:3px;transition:color 0.3s;}
    body.dark .share-sub{color:rgba(255,255,255,0.32);}
    body.light .share-sub{color:rgba(30,20,80,0.38);}

    /* ── Keypad: fills remaining space ── */
    .btn-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:clamp(7px,2vw,12px);
      flex:1; /* take all leftover height */
    }
    .btn{
      border:none;border-radius:20px;
      font-size:clamp(22px,6vw,32px);font-weight:500;
      cursor:pointer;transition:transform 0.1s,background 0.12s;
      font-family:'DM Sans',sans-serif;outline:none;user-select:none;
      display:flex;align-items:center;justify-content:center;
      width:100%;height:100%; /* fill grid cell */
    }
    .btn:active{transform:scale(0.87);}

    body.dark .btn.num{background:rgba(255,255,255,0.09);color:#fff;border:1px solid rgba(255,255,255,0.07);}
    body.light .btn.num{background:rgba(255,255,255,0.78);color:#0d0221;border:1px solid rgba(160,160,255,0.18);}
    body.dark  .btn.num:active{background:rgba(255,255,255,0.2);}
    body.light .btn.num:active{background:rgba(200,200,255,0.45);}

    body.dark  .btn.op-clear{background:rgba(255,50,80,0.18);color:#ff6080;border:1px solid rgba(255,50,80,0.22);font-size:clamp(14px,4vw,20px);}
    body.light .btn.op-clear{background:rgba(255,50,80,0.1);color:#dd1040;border:1px solid rgba(255,50,80,0.18);font-size:clamp(14px,4vw,20px);}

    body.dark  .btn.op-back{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.07);font-size:clamp(18px,5vw,26px);}
    body.light .btn.op-back{background:rgba(200,200,255,0.22);color:rgba(30,20,80,0.6);border:1px solid rgba(160,160,255,0.16);font-size:clamp(18px,5vw,26px);}

    body.dark  .btn.op-dot{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.07);font-size:clamp(26px,8vw,40px);font-weight:700;}
    body.light .btn.op-dot{background:rgba(200,200,255,0.22);color:rgba(30,20,80,0.75);border:1px solid rgba(160,160,255,0.16);font-size:clamp(26px,8vw,40px);font-weight:700;}

    /* dot spans full row */
    .btn.op-dot{grid-column:span 3;}

    /* ── Overlay & Sheet ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.62);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity 0.28s;}
    .overlay.open{opacity:1;pointer-events:all;}
    .sheet{border-radius:28px 28px 0 0;padding:26px 24px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:430px;border-bottom:none;transition:transform 0.28s cubic-bezier(.32,1,.28,1);transform:translateY(100%);}
    .overlay.open .sheet{transform:translateY(0);}
    body.dark  .sheet{background:linear-gradient(175deg,#0d0630,#050212);border:1px solid rgba(0,255,180,0.1);}
    body.light .sheet{background:linear-gradient(175deg,#f5f0ff,#eaf8ff);border:1px solid rgba(150,200,255,0.35);}
    .sheet-handle{width:38px;height:4px;border-radius:2px;margin:0 auto 22px;}
    body.dark  .sheet-handle{background:rgba(0,255,180,0.25);}
    body.light .sheet-handle{background:rgba(150,130,255,0.3);}
    .sheet-title{font-size:18px;font-weight:700;}
    body.dark  .sheet-title{color:#fff;}
    body.light .sheet-title{color:#0d0221;}
    .sheet-sub{font-size:13px;margin-top:3px;}
    body.dark  .sheet-sub{color:rgba(255,255,255,0.35);}
    body.light .sheet-sub{color:rgba(60,40,160,0.45);}
    .sheet-content{display:none;}
    .sheet-content.active{display:block;}

    .done-btn{width:100%;margin-top:20px;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#00ffcc,#00b8ff);color:#0d0221;font-size:16px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 5px 20px rgba(0,255,200,0.32);}
    .done-btn:active{transform:scale(0.97);}
    .done-btn.danger{background:rgba(239,68,68,0.18);box-shadow:none;color:#f87171;}

    .srow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;}
    .srow+.srow{border-top:1px solid;}
    body.dark  .srow+.srow{border-color:rgba(255,255,255,0.06);}
    body.light .srow+.srow{border-color:rgba(150,130,255,0.12);}
    .srow-lbl{font-size:15px;font-weight:500;}
    body.dark  .srow-lbl{color:rgba(255,255,255,0.85);}
    body.light .srow-lbl{color:#1a0a50;}
    .srow-sub{font-size:12px;margin-top:2px;}
    body.dark  .srow-sub{color:rgba(255,255,255,0.3);}
    body.light .srow-sub{color:rgba(60,40,160,0.4);}
    .toggle{width:46px;height:26px;border-radius:13px;cursor:pointer;border:none;transition:background 0.22s;position:relative;flex-shrink:0;}
    .toggle-knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.22s;box-shadow:0 1px 4px rgba(0,0,0,0.28);}
    .preset-btns{display:flex;gap:5px;flex-wrap:wrap;}
    .preset-mini{padding:6px 10px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
    .preset-mini:active{transform:scale(0.91);}

    .hist-list{margin-top:14px;max-height:52vh;overflow-y:auto;}
    .hist-item{padding:11px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
    .hist-item+.hist-item{border-top:1px solid;}
    body.dark  .hist-item+.hist-item{border-color:rgba(255,255,255,0.06);}
    body.light .hist-item+.hist-item{border-color:rgba(150,130,255,0.1);}
    .hist-item:hover{opacity:0.75;}
    .hist-expr{font-size:12px;font-family:'DM Mono',monospace;}
    body.dark  .hist-expr{color:rgba(0,255,200,0.5);}
    body.light .hist-expr{color:rgba(60,40,160,0.5);}
    .hist-time{font-size:10px;margin-top:2px;}
    body.dark  .hist-time{color:rgba(255,255,255,0.22);}
    body.light .hist-time{color:rgba(120,100,220,0.35);}
    .hist-result{font-size:16px;font-family:'DM Mono',monospace;font-weight:500;}
    body.dark  .hist-result{color:#00ffcc;}
    body.light .hist-result{color:#0d0221;}
    .hist-empty{text-align:center;padding:32px 0;font-size:14px;}
    body.dark  .hist-empty{color:rgba(255,255,255,0.22);}
    body.light .hist-empty{color:rgba(120,100,220,0.35);}

    /* ── Toast ── */
    .toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-10px);background:linear-gradient(135deg,#00ffcc,#00b8ff);color:#0d0221;padding:10px 24px;border-radius:22px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(0,255,200,0.42);opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body class="dark">

<div class="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-title">🇹🇭 คนละครึ่ง 60/40</div>
    <div class="hdr-icons">
      <button class="icon-btn" id="btn-theme">☀️</button>
      <button class="icon-btn" id="btn-history">🕐</button>
      <button class="icon-btn" id="btn-settings">⚙️</button>
    </div>
  </div>

  <!-- Display -->
  <div class="disp-area" id="disp-area">
    <div class="prev-disp" id="prev-disp">&nbsp;</div>
    <div class="main-disp" id="main-disp" style="font-size:clamp(40px,14vw,72px)">0</div>
    <div class="copy-hint">แตะเพื่อคัดลอก</div>
  </div>

  <!-- Split tabs -->
  <div class="split-tabs" id="split-tabs">
    <button class="split-tab" data-idx="0">50/50</button>
    <button class="split-tab active" data-idx="1">60/40</button>
    <button class="split-tab" data-idx="2">70/30</button>
    <button class="split-tab" data-idx="3">80/20</button>
  </div>

  <!-- Cards -->
  <div class="shares-row">
    <div class="share-card gov" id="card-gov">
      <div class="share-lbl" id="lbl-gov">รัฐจ่าย 60%</div>
      <div class="share-amt" id="amt-gov">฿0</div>
      <div class="share-sub" id="sub-gov">จากทั้งหมด ฿0</div>
    </div>
    <div class="share-card you" id="card-you">
      <div class="share-lbl" id="lbl-you">คุณจ่าย 40%</div>
      <div class="share-amt" id="amt-you">฿0</div>
      <div class="share-sub" id="sub-you">จากทั้งหมด ฿0</div>
    </div>
  </div>

  <!-- Numpad 3×4 + dot full-width -->
  <div class="btn-grid">
    <button class="btn num" data-digit="7">7</button>
    <button class="btn num" data-digit="8">8</button>
    <button class="btn num" data-digit="9">9</button>

    <button class="btn num" data-digit="4">4</button>
    <button class="btn num" data-digit="5">5</button>
    <button class="btn num" data-digit="6">6</button>

    <button class="btn num" data-digit="1">1</button>
    <button class="btn num" data-digit="2">2</button>
    <button class="btn num" data-digit="3">3</button>

    <button class="btn op-clear" id="btn-clear">C</button>
    <button class="btn num"      data-digit="0">0</button>
    <button class="btn op-back"  id="btn-back">⌫</button>

    <button class="btn op-dot"   data-digit=".">.</button>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <!-- Settings -->
    <div class="sheet-content" id="sheet-settings">
      <div class="sheet-title">⚙️ ตั้งค่า</div>
      <div style="margin-top:16px">
        <div class="srow">
          <div>
            <div class="srow-lbl">โหมดมืด</div>
            <div class="srow-sub">เปลี่ยนธีมสีของแอป</div>
          </div>
          <button class="toggle" id="toggle-dark" style="background:#00d4aa">
            <div class="toggle-knob" id="toggle-knob" style="left:23px"></div>
          </button>
        </div>
        <div class="srow">
          <div>
            <div class="srow-lbl">สัดส่วนการจ่าย</div>
            <div class="srow-sub">รัฐ / คุณ</div>
          </div>
          <div class="preset-btns" id="preset-btns-settings"></div>
        </div>
      </div>
      <button class="done-btn" id="close-settings">บันทึก</button>
    </div>

    <!-- History -->
    <div class="sheet-content" id="sheet-history">
      <div class="sheet-title">🕐 ประวัติการคำนวณ</div>
      <div class="sheet-sub">แตะเพื่อใช้ผลลัพธ์</div>
      <div class="hist-list" id="hist-list"></div>
      <button class="done-btn danger" id="clear-history" style="display:none">ล้างประวัติ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ คัดลอกแล้ว</div>

<script>
  const PRESETS = [
    {label:"50/50",gov:50,you:50},
    {label:"60/40",gov:60,you:40},
    {label:"70/30",gov:70,you:30},
    {label:"80/20",gov:80,you:20},
  ];

  let display = "0", splitIdx = 1, darkMode = true, history = [];

  const fmt = n => isNaN(n)||n===null ? "0" : Number(n).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});

  const $ = id => document.getElementById(id);
  const mainDisp = $("main-disp"), prevDisp = $("prev-disp");
  const overlay  = $("overlay"),   histList = $("hist-list");
  const clearHistBtn = $("clear-history"), toast = $("toast");

  /* ── Render ── */
  function renderDisplay() {
    const p = parseFloat(display);
    mainDisp.textContent = (isNaN(p)||display==="0") ? "0" : display.endsWith(".") ? fmt(p)+"." : fmt(p);
    const len = display.replace(/[^0-9]/g,"").length;
    mainDisp.style.fontSize = len>10?"28px":len>7?"38px":len>4?"50px":"clamp(40px,14vw,72px)";
  }

  function renderCards() {
    const total = parseFloat(display)||0;
    const p = PRESETS[splitIdx];
    const gov=(total*p.gov)/100, you=(total*p.you)/100;
    $("lbl-gov").textContent=`รัฐจ่าย ${p.gov}%`;
    $("amt-gov").textContent=`฿${fmt(gov)}`;
    $("sub-gov").textContent=`จากทั้งหมด ฿${fmt(total)}`;
    $("lbl-you").textContent=`คุณจ่าย ${p.you}%`;
    $("amt-you").textContent=`฿${fmt(you)}`;
    $("sub-you").textContent=`จากทั้งหมด ฿${fmt(total)}`;
    return {total,gov,you,p};
  }

  function renderTabs() {
    document.querySelectorAll(".split-tab").forEach((b,i)=>b.classList.toggle("active",i===splitIdx));
    renderPresetSettings();
  }

  function renderAll(){ renderDisplay(); renderCards(); renderTabs(); }

  function renderPresetSettings(){
    const c=$("preset-btns-settings"); c.innerHTML="";
    PRESETS.forEach((p,i)=>{
      const b=document.createElement("button");
      b.className="preset-mini"; b.textContent=p.label;
      b.style.background=i===splitIdx?"linear-gradient(135deg,#00ffcc,#00b8ff)":darkMode?"rgba(255,255,255,0.09)":"rgba(180,180,255,0.2)";
      b.style.color=i===splitIdx?"#0d0221":darkMode?"rgba(255,255,255,0.65)":"#2a1a70";
      b.onclick=()=>{splitIdx=i;renderAll();};
      c.appendChild(b);
    });
  }

  /* ── Input ── */
  function handleDigit(d){
    if(display==="0"&&d!==".") display=d;
    else if(d==="."&&display.includes(".")) return;
    else if(display.replace(/[^0-9]/g,"").length>=12) return;
    else display+=d;
    renderAll();
  }
  function handleClear(){ display="0"; prevDisp.innerHTML="&nbsp;"; renderAll(); }
  function handleBack(){ display=display.length>1?display.slice(0,-1):"0"; renderAll(); }

  /* ── History ── */
  function renderHistory(){
    if(!history.length){ histList.innerHTML='<div class="hist-empty">ยังไม่มีประวัติ</div>'; clearHistBtn.style.display="none"; return; }
    clearHistBtn.style.display="block"; histList.innerHTML="";
    history.forEach(h=>{
      const d=document.createElement("div"); d.className="hist-item";
      d.innerHTML=`<div><div class="hist-expr">${h.expr}</div><div class="hist-time">${h.time}</div></div><div class="hist-result">฿${fmt(parseFloat(h.result))}</div>`;
      d.onclick=()=>{ display=h.result; prevDisp.innerHTML="&nbsp;"; renderAll(); closeOverlay(); };
      histList.appendChild(d);
    });
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(){ clearTimeout(toastTimer); toast.classList.add("show"); toastTimer=setTimeout(()=>toast.classList.remove("show"),1500); }
  function copyText(t){
    if(navigator.clipboard){ navigator.clipboard.writeText(String(t)).then(showToast); }
    else{ const ta=document.createElement("textarea"); ta.value=String(t); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); showToast(); }
  }

  /* ── Sheet ── */
  function openSheet(name){
    document.querySelectorAll(".sheet-content").forEach(el=>el.classList.remove("active"));
    $("sheet-"+name).classList.add("active");
    if(name==="history") renderHistory();
    overlay.classList.add("open");
  }
  function closeOverlay(){ overlay.classList.remove("open"); }

  /* ── Theme ── */
  function setTheme(dark){
    darkMode=dark; document.body.className=dark?"dark":"light";
    $("btn-theme").textContent=dark?"☀️":"🌙";
    $("toggle-dark").style.background=dark?"#00d4aa":"rgba(180,180,255,0.3)";
    $("toggle-knob").style.left=dark?"23px":"3px";
    renderPresetSettings();
  }

  /* ── Events ── */
  document.querySelectorAll(".btn[data-digit]").forEach(b=>b.addEventListener("click",()=>handleDigit(b.dataset.digit)));
  $("btn-clear").onclick=handleClear;
  $("btn-back").onclick=handleBack;
  $("split-tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-idx]"); if(b){ splitIdx=parseInt(b.dataset.idx); renderAll(); }});
  $("disp-area").onclick=()=>copyText(display);
  $("card-gov").onclick=()=>{ const t=parseFloat(display)||0; copyText((t*PRESETS[splitIdx].gov/100).toFixed(2)); };
  $("card-you").onclick=()=>{ const t=parseFloat(display)||0; copyText((t*PRESETS[splitIdx].you/100).toFixed(2)); };
  $("btn-theme").onclick=()=>setTheme(!darkMode);
  $("toggle-dark").onclick=()=>setTheme(!darkMode);
  $("btn-history").onclick=()=>openSheet("history");
  $("btn-settings").onclick=()=>openSheet("settings");
  $("close-settings").onclick=closeOverlay;
  $("clear-history").onclick=()=>{ history=[]; renderHistory(); };
  overlay.addEventListener("click",e=>{ if(e.target===overlay) closeOverlay(); });

  renderAll();
</script>
</body>
</html>
